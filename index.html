<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Music Pro Ultimate</title>

<style>
body {
  background: linear-gradient(135deg, #121212, #1db954);
  color: white;
  font-family: Arial;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

input {
  margin: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

#playlist {
  margin-top: 20px;
  max-height: 300px;
  overflow-y: auto;
}

.song {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.song:hover {
  background: rgba(255,255,255,0.1);
}

.player {
  margin-top: 30px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  font-size: 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

#progress {
  width: 80%;
}

</style>
</head>

<body>

<h1>🎧 Music Pro Ultimate</h1>

<input type="file" id="upload" accept="audio/*">
<br>
<input type="text" id="search" placeholder="Cari lagu...">

<div id="playlist"></div>

<div class="player">
  <h2 id="title">Belum ada lagu</h2>
  
  <input type="range" id="progress" value="0">

  <div>
    <button onclick="prevSong()">⏮</button>
    <button onclick="playSong()">▶</button>
    <button onclick="pauseSong()">⏸</button>
    <button onclick="nextSong()">⏭</button>
  </div>
</div>

<audio id="audio"></audio>

<script>
let songs = JSON.parse(localStorage.getItem("songs")) || [];
let current = 0;

const audio = document.getElementById("audio");
const playlistDiv = document.getElementById("playlist");
const title = document.getElementById("title");
const progress = document.getElementById("progress");

// 🔄 Render Playlist
function renderPlaylist(filter = "") {
  playlistDiv.innerHTML = "";
  songs
    .filter(s => s.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach((song, index) => {
      let div = document.createElement("div");
      div.className = "song";
      div.innerText = song.name;
      div.onclick = () => playIndex(index);
      playlistDiv.appendChild(div);
    });
}

// ▶ Play Lagu
function playIndex(i) {
  current = i;
  audio.src = songs[i].url;
  title.innerText = songs[i].name;
  audio.play();
}

// ⏸ Pause
function pauseSong() {
  audio.pause();
}

// ▶ Play
function playSong() {
  if (songs.length > 0) {
    playIndex(current);
  }
}

// ⏭ Next
function nextSong() {
  current = (current + 1) % songs.length;
  playIndex(current);
}

// ⏮ Prev
function prevSong() {
  current = (current - 1 + songs.length) % songs.length;
  playIndex(current);
}

// 📂 Upload Lagu
document.getElementById("upload").addEventListener("change", function(e) {
  let file = e.target.files[0];
  if (!file) return;

  let url = URL.createObjectURL(file);

  songs.push({
    name: file.name,
    url: url
  });

  localStorage.setItem("songs", JSON.stringify(songs));
  renderPlaylist();
});

// 🔍 Search
document.getElementById("search").addEventListener("input", function(e) {
  renderPlaylist(e.target.value);
});

// ⏱ Progress Bar
audio.ontimeupdate = () => {
  if (audio.duration) {
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
};

progress.oninput = () => {
  if (audio.duration) {
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
};

// 🔁 Auto Next
audio.onended = nextSong;

// Init
renderPlaylist();
</script>

</body>
</html>
