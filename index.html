<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Web Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
}

.results {
  padding: 10px;
}

.song {
  display: flex;
  align-items: center;
  background: #1e1e1e;
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

.song img {
  width: 100px;
  border-radius: 10px;
  margin-right: 10px;
}

.song:hover {
  background: #333;
}

.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
}

iframe {
  width: 100%;
  height: 200px;
  border: none;
}
</style>
</head>

<body>

<header>🎧 Music Web Pro</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu apa saja..." />
</div>

<div class="results" id="results"></div>

<div class="player">
  <p id="nowPlaying">Belum ada lagu</p>
  <iframe id="player"></iframe>
</div>

<script>
const API_KEY = "MASUKKAN_API_KEY_KAMU";

const results = document.getElementById("results");
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

/* SEARCH */
document.getElementById("search").addEventListener("keydown", async function(e){
  if(e.key === "Enter"){
    const query = this.value.trim();
    if(!query) return;

    results.innerHTML = "Loading...";

    try {
      const res = await fetch(
        `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=10&q=${query}&key=${API_KEY}`
      );

      const data = await res.json();

      results.innerHTML = "";

      if(!data.items || data.items.length === 0){
        results.innerHTML = "❌ Lagu tidak ditemukan";
        return;
      }

      data.items.forEach(item => {
        const div = document.createElement("div");
        div.className = "song";

        div.innerHTML = `
          <img src="${item.snippet.thumbnails.medium.url}">
          <div>
            <strong>${item.snippet.title}</strong><br>
            <small>${item.snippet.channelTitle}</small>
          </div>
        `;

        div.onclick = () => {
          const videoId = item.id.videoId;

          player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
          nowPlaying.innerText = item.snippet.title;
        };

        results.appendChild(div);
      });

    } catch (err) {
      results.innerHTML = "❌ Error koneksi / API";
      console.error(err);
    }
  }
});
</script>

</body>
</html>
