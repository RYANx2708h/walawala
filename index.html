<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Spotify Pro</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

/* HEADER */
header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* SEARCH */
.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

/* BUTTON TAB */
.tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.tabs button {
  padding: 8px 15px;
  border-radius: 20px;
  border: none;
  background: #333;
  color: white;
  cursor: pointer;
}

.tabs button.active {
  background: #1db954;
}

/* CONTENT */
.content {
  padding: 10px;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
}

iframe {
  width: 100%;
  height: 140px;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>🎧 My Spotify PRO</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu & tekan ENTER...">
</div>

<div class="tabs">
  <button onclick="showTab('search')" class="active" id="btnSearch">Search</button>
  <button onclick="showTab('fav')" id="btnFav">❤️ Favorit</button>
</div>

<div class="content" id="content"></div>

<div class="player" id="player">
  <p id="nowPlaying">Belum ada lagu</p>
</div>

<script>
let favorites = JSON.parse(localStorage.getItem("fav")) || [];

const content = document.getElementById("content");
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

/* TAB */
function showTab(tab) {
  document.getElementById("btnSearch").classList.remove("active");
  document.getElementById("btnFav").classList.remove("active");

  if (tab === "search") {
    document.getElementById("btnSearch").classList.add("active");
    content.innerHTML = "<p>Ketik lagu di atas...</p>";
  } else {
    document.getElementById("btnFav").classList.add("active");
    renderFav();
  }
}

/* SEARCH */
document.getElementById("search").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    const query = this.value;
    searchSound(query);
  }
});

function searchSound(query) {
  content.innerHTML = `
    <iframe 
      src="https://w.soundcloud.com/player/?url=https://soundcloud.com/search?q=${encodeURIComponent(query)}&auto_play=true">
    </iframe>
    <br>
    <button onclick="addFav('${query}')">❤️ Simpan ke Favorit</button>
  `;

  nowPlaying.innerText = "Search: " + query;
}

/* PLAY */
function playSong(query) {
  player.innerHTML = `
    <p>${query}</p>
    <iframe 
      src="https://w.soundcloud.com/player/?url=https://soundcloud.com/search?q=${encodeURIComponent(query)}&auto_play=true">
    </iframe>
  `;

  nowPlaying.innerText = query;
}

/* FAVORIT */
function addFav(query) {
  if (!favorites.includes(query)) {
    favorites.push(query);
    localStorage.setItem("fav", JSON.stringify(favorites));
    alert("Ditambahkan ke favorit!");
  }
}

function renderFav() {
  content.innerHTML = "";

  if (favorites.length === 0) {
    content.innerHTML = "<p>Belum ada favorit</p>";
    return;
  }

  favorites.forEach(song => {
    const div = document.createElement("div");
    div.style.padding = "10px";
    div.style.background = "#1e1e1e";
    div.style.margin = "5px 0";
    div.style.borderRadius = "10px";
    div.style.cursor = "pointer";

    div.innerText = song;

    div.onclick = () => playSong(song);

    content.appendChild(div);
  });
}

/* INIT */
content.innerHTML = "<p>Ketik lagu di atas...</p>";
</script>

</body>
</html>
