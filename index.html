<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Spotify Web</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

/* HEADER */
header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

/* SEARCH */
.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

/* SONG LIST */
.results {
  padding: 10px;
}

.song {
  padding: 12px;
  margin: 6px 0;
  background: #1e1e1e;
  border-radius: 10px;
  cursor: pointer;
}

.song:hover {
  background: #333;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
  text-align: center;
}

button {
  margin: 5px;
  padding: 10px;
  border-radius: 50%;
  border: none;
  background: #1db954;
  color: white;
}

input[type="file"] {
  margin: 10px;
}
</style>
</head>

<body>

<header>🎧 My Spotify Clone</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu online...">
</div>

<div style="text-align:center;">
  <input type="file" id="upload" accept="audio/*">
</div>

<div class="results" id="results"></div>

<div class="player">
  <p id="nowPlaying">Belum ada lagu</p>
  <audio id="audio" controls></audio><br>
</div>

<script>
const audio = document.getElementById("audio");
const results = document.getElementById("results");
const nowPlaying = document.getElementById("nowPlaying");

/* 🔍 SEARCH ONLINE (iTunes API) */
document.getElementById("search").addEventListener("input", async (e) => {
  const query = e.target.value;

  if (query.length < 3) {
    results.innerHTML = "";
    return;
  }

  const res = await fetch(`https://itunes.apple.com/search?term=${query}&entity=song&limit=10`);
  const data = await res.json();

  results.innerHTML = "";

  data.results.forEach(song => {
    const div = document.createElement("div");
    div.className = "song";

    div.innerHTML = `
      <strong>${song.trackName}</strong><br>
      <small>${song.artistName}</small>
    `;

    div.onclick = () => {
      // ⚠️ ini masih preview (30 detik)
      audio.src = song.previewUrl;
      nowPlaying.innerText = song.trackName + " - " + song.artistName;
      audio.play();
    };

    results.appendChild(div);
  });
});

/* 📂 UPLOAD = FULL SONG */
document.getElementById("upload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    audio.src = url;
    nowPlaying.innerText = file.name;
    audio.play();
  }
});
</script>

</body>
</html>
