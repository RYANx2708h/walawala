<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player Global</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
}

.results {
  padding: 10px;
}

.song {
  padding: 12px;
  margin: 6px 0;
  background: #1e1e1e;
  border-radius: 10px;
  cursor: pointer;
}

.song:hover {
  background: #333;
}

.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
}
</style>
</head>

<body>

<header>🎧 Music Player (Global)</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu Indonesia / global...">
</div>

<div class="results" id="results"></div>

<div class="player">
  <p id="nowPlaying">Belum ada lagu</p>
  <audio id="audio" controls></audio>
</div>

<script>
const audio = document.getElementById("audio");
const results = document.getElementById("results");
const nowPlaying = document.getElementById("nowPlaying");

/* SEARCH INTERNET ARCHIVE */
document.getElementById("search").addEventListener("keydown", async function(e) {
  if (e.key === "Enter") {
    const query = this.value;

    results.innerHTML = "Loading...";

    const res = await fetch(`https://archive.org/advancedsearch.php?q=${query}+AND+mediatype:audio&fl[]=identifier,title&rows=10&output=json`);
    const data = await res.json();

    results.innerHTML = "";

    const docs = data.response.docs;

    if (!docs.length) {
      results.innerHTML = "❌ Lagu tidak ditemukan";
      return;
    }

    docs.forEach(item => {
      const div = document.createElement("div");
      div.className = "song";
      div.innerText = item.title;

      div.onclick = () => loadTrack(item.identifier, item.title);

      results.appendChild(div);
    });
  }
});

/* LOAD TRACK */
async function loadTrack(id, title) {
  nowPlaying.innerText = "Loading...";

  const res = await fetch(`https://archive.org/metadata/${id}`);
  const data = await res.json();

  const file = data.files.find(f => f.name.endsWith(".mp3"));

  if (!file) {
    nowPlaying.innerText = "❌ File tidak ditemukan";
    return;
  }

  const url = `https://archive.org/download/${id}/${file.name}`;

  audio.src = url;
  audio.play();

  nowPlaying.innerText = title;
}
</script>

</body>
</html>
