<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Music App (YouTube)</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

/* HEADER */
header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

/* SEARCH */
.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

/* RESULTS */
.results {
  padding: 10px;
}

.song {
  display: flex;
  align-items: center;
  background: #1e1e1e;
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

.song img {
  width: 80px;
  height: 60px;
  border-radius: 8px;
  margin-right: 10px;
}

.song:hover {
  background: #333;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
}

iframe {
  width: 100%;
  height: 200px;
  border-radius: 10px;
  border: none;
}
</style>
</head>

<body>

<header>🎧 My Spotify (YouTube)</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu apa saja..." />
</div>

<div class="results" id="results"></div>

<div class="player">
  <p id="nowPlaying">Belum ada lagu</p>
  <iframe id="playerFrame"></iframe>
</div>

<script>
const results = document.getElementById("results");
const player = document.getElementById("playerFrame");
const nowPlaying = document.getElementById("nowPlaying");

/* 🔍 SEARCH (tanpa API key, pakai embed search) */
document.getElementById("search").addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    const query = this.value;

    results.innerHTML = "";

    // tampilkan beberapa pilihan klik
    for (let i = 1; i <= 8; i++) {
      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/0.jpg">
        <div>
          <strong>${query}</strong><br>
          <small>Hasil ${i}</small>
        </div>
      `;

      div.onclick = () => playVideo(query);

      results.appendChild(div);
    }
  }
});

/* ▶️ PLAY */
function playVideo(query) {
  nowPlaying.innerText = "Now Playing: " + query;

  player.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(query)}&autoplay=1`;
}
</script>

</body>
</html>
