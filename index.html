<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎧 Music App Simple</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

/* HEADER */
header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

/* SEARCH */
.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  padding: 12px;
  border-radius: 25px;
  border: none;
}

/* PLAYER */
.player {
  margin: 10px;
}

/* IFRAME */
iframe {
  width: 100%;
  height: 250px;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>🎧 Music Web (No API)</header>

<div class="search-box">
  <input id="search" placeholder="Cari lagu lalu tekan ENTER...">
</div>

<div class="player">
  <p id="now">Belum ada lagu</p>
  <iframe id="frame"></iframe>
</div>

<script>
const frame = document.getElementById("frame");
const now = document.getElementById("now");

/* SEARCH */
document.getElementById("search").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    const q = this.value.trim();
    if(!q) return;

    now.innerText = "Now Playing: " + q;

    frame.src = `https://www.youtube.com/embed?listType=search&list=${encodeURIComponent(q)}&autoplay=1`;
  }
});
</script>

</body>
</html>
