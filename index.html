<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player Simple</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #1db954;
  font-size: 20px;
  font-weight: bold;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

.results {
  padding: 10px;
}

.song {
  padding: 12px;
  margin: 6px 0;
  background: #1e1e1e;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.song:hover {
  background: #333;
}

.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
  text-align: center;
}

button {
  margin: 5px;
  padding: 10px;
  border: none;
  border-radius: 50%;
  background: #1db954;
  color: white;
  cursor: pointer;
}

input[type="file"] {
  margin: 10px;
}
</style>
</head>

<body>

<header>🎧 Music Player</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu & klik langsung play...">
</div>

<div style="text-align:center;">
  <input type="file" id="upload" accept="audio/*">
</div>

<div class="results" id="results"></div>

<div class="player">
  <p id="nowPlaying">Belum ada lagu</p>
  <audio id="audio" controls></audio><br>

  <button onclick="prev()">⏮</button>
  <button onclick="audio.play()">▶️</button>
  <button onclick="next()">⏭</button>
</div>

<script>
let songs = [
  { name: "SoundHelix 1", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
  { name: "SoundHelix 2", url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
];

let current = 0;

const audio = document.getElementById("audio");
const results = document.getElementById("results");
const search = document.getElementById("search");
const nowPlaying = document.getElementById("nowPlaying");

/* TAMPILKAN LIST */
function show(list) {
  results.innerHTML = "";
  list.forEach((song, index) => {
    const div = document.createElement("div");
    div.className = "song";
    div.innerText = song.name;

    div.onclick = () => {
      current = songs.indexOf(song);
      playSong();
    };

    results.appendChild(div);
  });
}

/* PLAY */
function playSong() {
  audio.src = songs[current].url;
  nowPlaying.innerText = "Now Playing: " + songs[current].name;
  audio.play();
}

/* NEXT */
function next() {
  current = (current + 1) % songs.length;
  playSong();
}

/* PREV */
function prev() {
  current = (current - 1 + songs.length) % songs.length;
  playSong();
}

/* SEARCH LANGSUNG */
search.addEventListener("input", () => {
  const key = search.value.toLowerCase();

  const filtered = songs.filter(s =>
    s.name.toLowerCase().includes(key)
  );

  show(filtered);
});

/* UPLOAD */
document.getElementById("upload").addEventListener("change", e => {
  const file = e.target.files[0];
  if (file) {
    songs.push({
      name: file.name,
      url: URL.createObjectURL(file)
    });
    show(songs);
  }
});

/* AUTO NEXT */
audio.addEventListener("ended", next);

/* INIT */
show(songs);
</script>

</body>
</html>
