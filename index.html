<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Style - SoundCloud</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

.results {
  padding: 10px;
}

.song {
  padding: 12px;
  margin: 6px 0;
  background: #1e1e1e;
  border-radius: 10px;
  cursor: pointer;
}

.song:hover {
  background: #333;
}

.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
}

iframe {
  width: 100%;
  height: 120px;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>🎧 My Spotify Clone (SoundCloud)</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu (SoundCloud)...">
</div>

<div class="results" id="results"></div>

<div class="player" id="player">
  <p id="nowPlaying">Belum ada lagu</p>
</div>

<script>
const results = document.getElementById("results");
const player = document.getElementById("player");
const nowPlaying = document.getElementById("nowPlaying");

/* 🔍 SEARCH (pakai SoundCloud embed trick) */
document.getElementById("search").addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    const query = this.value;

    results.innerHTML = "";

    // tampilkan 5 hasil dummy klik (karena SC tidak kasih API bebas tanpa key)
    for (let i = 1; i <= 5; i++) {
      const div = document.createElement("div");
      div.className = "song";
      div.innerText = query + " (hasil " + i + ")";

      div.onclick = () => {
        playSoundCloud(query);
      };

      results.appendChild(div);
    }
  }
});

/* 🎧 PLAY FULL SOUND */
function playSoundCloud(query) {
  nowPlaying.innerText = "Now Playing: " + query;

  player.innerHTML = `
    <p>${query}</p>
    <iframe 
      src="https://w.soundcloud.com/player/?url=https://soundcloud.com/search?q=${encodeURIComponent(query)}"
      allow="autoplay">
    </iframe>
  `;
}
</script>

</body>
</html>
