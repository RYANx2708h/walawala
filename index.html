<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Pro Music Player</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(270deg, #ff6ec4, #7873f5);
  background-size: 400% 400%;
  animation: bg 10s infinite;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

@keyframes bg {
  0% {background-position: 0%;}
  50% {background-position: 100%;}
  100% {background-position: 0%;}
}

.player {
  width: 320px;
  background: rgba(0,0,0,0.4);
  padding: 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  text-align: center;
}

img {
  width: 100%;
  border-radius: 15px;
  margin-bottom: 10px;
}

.controls button {
  margin: 5px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.playlist {
  margin-top: 10px;
  max-height: 120px;
  overflow-y: auto;
  text-align: left;
}

.song {
  padding: 5px;
  cursor: pointer;
}

.song:hover {
  background: rgba(255,255,255,0.2);
}
</style>
</head>

<body>

<div class="player">
  <h2>🎧 Music Pro</h2>

  <img id="cover" src="https://via.placeholder.com/300x300?text=No+Cover">

  <p id="judul">No song</p>

  <!-- upload -->
  <input type="file" accept="audio/*" onchange="uploadLagu(event)">

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="play()">▶</button>
    <button onclick="pause()">⏸</button>
    <button onclick="next()">⏭</button>
  </div>

  <audio id="music"></audio>

  <div class="playlist" id="playlist"></div>
</div>

<script>
let playlist = [];
let current = 0;

const music = document.getElementById("music");
const judul = document.getElementById("judul");
const cover = document.getElementById("cover");
const list = document.getElementById("playlist");

function uploadLagu(e) {
  const file = e.target.files[0];
  const url = URL.createObjectURL(file);

  const song = {
    name: file.name,
    src: url
  };

  playlist.push(song);
  renderPlaylist();
}

function renderPlaylist() {
  list.innerHTML = "";
  playlist.forEach((s, i) => {
    list.innerHTML += `<div class="song" onclick="playIndex(${i})">${s.name}</div>`;
  });
}

function playIndex(i) {
  current = i;
  music.src = playlist[i].src;
  music.play();
  judul.innerText = playlist[i].name;

  // cover random aesthetic
  cover.src = "https://picsum.photos/300?random=" + Math.random();
}

function play() {
  music.play();
}

function pause() {
  music.pause();
}

function next() {
  if (playlist.length === 0) return;
  current = (current + 1) % playlist.length;
  playIndex(current);
}

function prev() {
  if (playlist.length === 0) return;
  current = (current - 1 + playlist.length) % playlist.length;
  playIndex(current);
}
</script>

</body>
</html>
