<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Spotify Jamendo</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #121212;
  color: white;
}

header {
  background: #1db954;
  padding: 15px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
}

.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 85%;
  padding: 12px;
  border-radius: 25px;
  border: none;
  outline: none;
}

.results {
  padding: 10px;
}

.song {
  display: flex;
  align-items: center;
  background: #1e1e1e;
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  cursor: pointer;
}

.song img {
  width: 60px;
  height: 60px;
  border-radius: 10px;
  margin-right: 10px;
}

.song:hover {
  background: #333;
}

.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #181818;
  padding: 10px;
}

button {
  background: #1db954;
  border: none;
  padding: 8px 12px;
  border-radius: 10px;
  color: white;
  margin-top: 5px;
}
</style>
</head>

<body>

<header>🎧 My Spotify (Full Music)</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cari lagu..." />
</div>

<div class="results" id="results"></div>

<div class="player">
  <p id="nowPlaying">Belum ada lagu</p>
  <audio id="audio" controls></audio><br>
  <button onclick="addFav()">❤️ Simpan</button>
</div>

<script>
const audio = document.getElementById("audio");
const results = document.getElementById("results");
const nowPlaying = document.getElementById("nowPlaying");

let currentSong = null;
let favorites = JSON.parse(localStorage.getItem("fav")) || [];

/* 🔑 API KEY JAMENDO (PUBLIC DEMO) */
const CLIENT_ID = "demo";

/* 🔍 SEARCH */
document.getElementById("search").addEventListener("keypress", async function(e) {
  if (e.key === "Enter") {
    const query = this.value;

    results.innerHTML = "Loading...";

    const res = await fetch(`https://api.jamendo.com/v3.0/tracks/?client_id=${CLIENT_ID}&format=json&limit=10&namesearch=${query}`);
    const data = await res.json();

    results.innerHTML = "";

    data.results.forEach(song => {
      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <img src="${song.album_image}">
        <div>
          <strong>${song.name}</strong><br>
          <small>${song.artist_name}</small>
        </div>
      `;

      div.onclick = () => playSong(song);

      results.appendChild(div);
    });
  }
});

/* ▶️ PLAY */
function playSong(song) {
  currentSong = song;
  audio.src = song.audio;
  audio.play();

  nowPlaying.innerText = song.name + " - " + song.artist_name;
}

/* ❤️ FAVORIT */
function addFav() {
  if (!currentSong) return;

  if (!favorites.find(f => f.id === currentSong.id)) {
    favorites.push(currentSong);
    localStorage.setItem("fav", JSON.stringify(favorites));
    alert("Ditambahkan ke favorit!");
  }
}
</script>

</body>
</html>
