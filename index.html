<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ujian Online</title>

<style>
body {
    font-family: Arial;
    background: #0f172a;
    color: white;
    text-align: center;
}

.container {
    background: #1e293b;
    padding: 20px;
    margin: 30px auto;
    width: 90%;
    max-width: 500px;
    border-radius: 12px;
}

input {
    padding: 10px;
    width: 80%;
    border-radius: 8px;
    border: none;
}

button {
    padding: 10px 20px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #16a34a;
}

.soal {
    text-align: left;
    margin-top: 15px;
}

.timer {
    font-weight: bold;
    color: #facc15;
}
</style>
</head>

<body>

<div class="container" id="login">
<h2>LOGIN UJIAN</h2>
<input type="text" id="nama" placeholder="Masukkan Nama"><br>
<button onclick="mulai()">Mulai Ujian</button>
</div>

<div class="container" id="ujian" style="display:none;">
<h3 class="timer" id="timer">Waktu: 60</h3>
<div id="soal"></div>
<button onclick="selesai()">Selesai</button>
</div>

<div class="container" id="hasil" style="display:none;">
<h2>HASIL UJIAN</h2>
<p id="nilai"></p>
</div>

<script>
let waktu = 60;
let timer;

let soal = [
{
tanya: "Ibukota Indonesia?",
a: "Jakarta",
b: "Bandung",
c: "Surabaya",
jawab: "a"
},
{
tanya: "2 + 2 = ?",
a: "3",
b: "4",
c: "5",
jawab: "b"
},
{
tanya: "Bahasa pemrograman untuk web?",
a: "HTML",
b: "Photoshop",
c: "Excel",
jawab: "a"
}
];

function mulai(){
let nama = document.getElementById("nama").value;
if(nama === ""){
alert("Isi nama dulu!");
return;
}

document.getElementById("login").style.display = "none";
document.getElementById("ujian").style.display = "block";

tampilSoal();
startTimer();
}

function tampilSoal(){
let html = "";

soal.forEach((s, i)=>{
html += `
<div class="soal">
<p>${i+1}. ${s.tanya}</p>
<label><input type="radio" name="q${i}" value="a"> ${s.a}</label><br>
<label><input type="radio" name="q${i}" value="b"> ${s.b}</label><br>
<label><input type="radio" name="q${i}" value="c"> ${s.c}</label><br>
</div>
`;
});

document.getElementById("soal").innerHTML = html;
}

function startTimer(){
timer = setInterval(()=>{
waktu--;
document.getElementById("timer").innerText = "Waktu: " + waktu;

if(waktu <= 0){
clearInterval(timer);
selesai();
}
},1000);
}

function selesai(){
clearInterval(timer);

let skor = 0;

soal.forEach((s, i)=>{
let pilih = document.querySelector(`input[name=q${i}]:checked`);
if(pilih && pilih.value === s.jawab){
skor++;
}
});

document.getElementById("ujian").style.display = "none";
document.getElementById("hasil").style.display = "block";

let nilaiAkhir = (skor / soal.length) * 100;

document.getElementById("nilai").innerHTML =
"Nilai kamu: <b>" + nilaiAkhir.toFixed(0) + "</b>";
}
</script>

</body>
</html>
