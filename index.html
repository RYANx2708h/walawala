<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Music Online Pro</title>

<style>
body {
  background: linear-gradient(135deg, #121212, #1db954);
  color: white;
  font-family: Arial;
  text-align: center;
}

input {
  margin: 10px;
  padding: 10px;
  border-radius: 8px;
  border: none;
}

#results, #playlist {
  margin-top: 20px;
}

.song {
  padding: 10px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.2);
}

.song:hover {
  background: rgba(255,255,255,0.1);
}

img {
  width: 60px;
  border-radius: 5px;
  vertical-align: middle;
}

.player {
  margin-top: 30px;
}

button {
  padding: 10px;
  margin: 5px;
}
</style>
</head>

<body>

<h1>🎧 Music Online Pro</h1>

<input type="text" id="search" placeholder="Cari lagu online...">

<div id="results"></div>

<div class="player">
  <h2 id="title">Belum ada lagu</h2>
  <audio id="audio" controls></audio>
</div>

<script>
const searchInput = document.getElementById("search");
const resultsDiv = document.getElementById("results");
const audio = document.getElementById("audio");
const title = document.getElementById("title");

// 🔍 SEARCH ONLINE (iTunes API)
searchInput.addEventListener("input", async function() {
  let query = searchInput.value;
  if (query.length < 3) return;

  let res = await fetch("https://itunes.apple.com/search?term=" + query + "&media=music&limit=10");
  let data = await res.json();

  resultsDiv.innerHTML = "";

  data.results.forEach(song => {
    let div = document.createElement("div");
    div.className = "song";

    div.innerHTML = `
      <img src="${song.artworkUrl100}">
      ${song.trackName} - ${song.artistName}
    `;

    div.onclick = () => {
      audio.src = song.previewUrl;
      title.innerText = song.trackName;
      audio.play();
    };

    resultsDiv.appendChild(div);
  });
});
</script>

</body>
</html>
