<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Music Aesthetic</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial;
      color: white;
      background: linear-gradient(270deg, #ff6ec4, #7873f5);
      background-size: 400% 400%;
      animation: bg 10s ease infinite;
    }

    @keyframes bg {
      0% {background-position: 0%;}
      50% {background-position: 100%;}
      100% {background-position: 0%;}
    }

    .box {
      text-align: center;
      background: rgba(0,0,0,0.4);
      padding: 30px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body onclick="playMusic()">

  <div class="box">
  <h1>🎧 My Music</h1>

  <p id="judul">Pilih lagu...</p>

  <select onchange="gantiLagu(this.value)">
    <option value="">-- pilih lagu --</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">Lagu 1</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">Lagu 2</option>
    <option value="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">Lagu 3</option>
  </select>

  <br><br>

  <input type="range" min="0" max="1" step="0.1" onchange="aturVolume(this.value)">

  <br><br>

  <button onclick="toggleMusic()">Play / Pause</button>
  </div>

  <audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
  </audio>

  <script>
    const music = document.getElementById("music");

    function playMusic() {
      music.play();
    }

    function toggleMusic() {
      if (music.paused) {
        music.play();
      } else {
        music.pause();
      }
    }
  </script>

</body>
</html>
