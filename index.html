<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔥 Super Music App</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0d0d0d;
  color: white;
}

/* HEADER */
header {
  background: linear-gradient(90deg,#1db954,#191414);
  padding: 15px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}

/* SEARCH */
.search-box {
  padding: 15px;
  text-align: center;
}

.search-box input {
  width: 90%;
  padding: 12px;
  border-radius: 30px;
  border: none;
}

/* SONG LIST */
.song {
  display: flex;
  align-items: center;
  padding: 10px;
  margin: 6px;
  background: #1a1a1a;
  border-radius: 10px;
  cursor: pointer;
}

.song:hover {
  background: #333;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: #111;
  padding: 10px;
}

/* HIDDEN VIDEO */
iframe {
  display: none;
}

/* AUDIO UI */
.controls {
  display: flex;
  justify-content: center;
  gap: 10px;
}

button {
  background: #1db954;
  border: none;
  padding: 10px;
  border-radius: 50%;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<header>🔥 Super Music App</header>

<div class="search-box">
  <input id="search" placeholder="Cari lagu apapun..." />
</div>

<div id="results"></div>

<div class="player">
  <p id="now">Belum ada lagu</p>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="play()">▶️</button>
    <button onclick="next()">⏭</button>
    <button onclick="addFav()">❤️</button>
  </div>

  <iframe id="yt"></iframe>
</div>

<script>
let playlist = [];
let current = 0;
let fav = JSON.parse(localStorage.getItem("fav")||"[]");

const yt = document.getElementById("yt");
const results = document.getElementById("results");
const now = document.getElementById("now");

/* SEARCH */
document.getElementById("search").addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    const q = this.value;
    results.innerHTML = "";

    playlist = [];

    for(let i=0;i<10;i++){
      playlist.push(q);

      const div = document.createElement("div");
      div.className="song";
      div.innerText = q + " ("+(i+1)+")";

      div.onclick = ()=>{
        current=i;
        load();
      };

      results.appendChild(div);
    }
  }
});

/* LOAD */
function load(){
  let q = playlist[current];
  now.innerText = "Now Playing: " + q;

  yt.src = "https://www.youtube.com/embed?listType=search&list="+encodeURIComponent(q)+"&autoplay=1";
}

/* CONTROL */
function play(){ load(); }
function next(){ current=(current+1)%playlist.length; load(); }
function prev(){ current=(current-1+playlist.length)%playlist.length; load(); }

/* FAVORIT */
function addFav(){
  let song = playlist[current];
  if(!fav.includes(song)){
    fav.push(song);
    localStorage.setItem("fav",JSON.stringify(fav));
    alert("Masuk favorit!");
  }
}
</script>

</body>
</html>
